site_name: listenflow-faster-whisper
site_description: Offline faster-whisper speech recognition for listenflow
docs_dir: docs
repo_url: https://github.com/sync-dev-org/listenflow-faster-whisper
repo_name: sync-dev-org/listenflow-faster-whisper
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - API reference:
      - Faster-whisper engine: api/faster_whisper.md
